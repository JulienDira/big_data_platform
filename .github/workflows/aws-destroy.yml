name: AWS Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type DESTROY to confirm teardown of the AWS deployment.
        required: true
        type: choice
        options:
          - DESTROY

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

concurrency:
  group: aws-dev-destroy
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy AWS deployment
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FARGATE_SUBNET_IDS: ${{ vars.FARGATE_SUBNET_IDS }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: big-data-platform/dev
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      VPC_ID: ${{ vars.VPC_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: gha-big-data-destroy-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Guard against accidental destruction
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Confirmation input must be DESTROY." >&2
            exit 1
          fi

      - name: Collect destroy inputs from existing stacks
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/batch init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/batch.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          echo "SILVER_GLUE_JOB_NAME=$(terraform -chdir=infra/aws/batch output -raw silver_glue_job_name)" >> "${GITHUB_ENV}"
          echo "GOLD_GLUE_JOB_NAME=$(terraform -chdir=infra/aws/batch output -raw gold_glue_job_name)" >> "${GITHUB_ENV}"
          echo "LAKE_BUCKET_NAME=$(terraform -chdir=infra/aws/batch output -raw lake_bucket_name)" >> "${GITHUB_ENV}"
          echo "ATHENA_RESULTS_BUCKET_NAME=$(terraform -chdir=infra/aws/batch output -raw athena_results_bucket_name)" >> "${GITHUB_ENV}"
          echo "ATHENA_OUTPUT_LOCATION=$(terraform -chdir=infra/aws/batch output -raw athena_output_location)" >> "${GITHUB_ENV}"
          echo "ATHENA_WORKGROUP_NAME=$(terraform -chdir=infra/aws/batch output -raw athena_workgroup_name)" >> "${GITHUB_ENV}"

          terraform -chdir=infra/aws/serving init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/serving.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          echo "LATEST_PROJECTION_LAMBDA_ARN=$(terraform -chdir=infra/aws/serving output -raw latest_projection_lambda_arn)" >> "${GITHUB_ENV}"

      - name: Destroy orchestration stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/orchestration init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/orchestration.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/orchestration destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="silver_glue_job_name=${SILVER_GLUE_JOB_NAME}" \
            -var="gold_glue_job_name=${GOLD_GLUE_JOB_NAME}" \
            -var="latest_projection_lambda_arn=${LATEST_PROJECTION_LAMBDA_ARN}"

      - name: Destroy serving stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/serving init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/serving.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/serving destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="lake_bucket_name=${LAKE_BUCKET_NAME}" \
            -var="athena_results_bucket_name=${ATHENA_RESULTS_BUCKET_NAME}" \
            -var="athena_output_location=${ATHENA_OUTPUT_LOCATION}" \
            -var="athena_workgroup_name=${ATHENA_WORKGROUP_NAME}"

      - name: Read core stack outputs for batch destroy
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/core init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/core.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          echo "KINESIS_STREAM_NAME=$(terraform -chdir=infra/aws/core output -raw kinesis_stream_name)" >> "${GITHUB_ENV}"
          echo "KINESIS_STREAM_ARN=$(terraform -chdir=infra/aws/core output -raw kinesis_stream_arn)" >> "${GITHUB_ENV}"

      - name: Destroy batch stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/batch init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/batch.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/batch destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="market_candles_stream_name=${KINESIS_STREAM_NAME}" \
            -var="market_candles_stream_arn=${KINESIS_STREAM_ARN}" \
            -var="force_destroy_buckets=true"

      - name: Destroy core stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/core init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/core.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/core destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="vpc_id=${VPC_ID}" \
            -var="fargate_subnet_ids=${FARGATE_SUBNET_IDS}"
