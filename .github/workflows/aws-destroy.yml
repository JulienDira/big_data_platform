name: AWS Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type DESTROY to confirm teardown of the AWS deployment.
        required: true
        type: choice
        options:
          - DESTROY

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

concurrency:
  group: aws-dev-destroy
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy AWS deployment
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FARGATE_SUBNET_IDS: ${{ vars.FARGATE_SUBNET_IDS }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: big-data-platform/dev
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      VPC_ID: ${{ vars.VPC_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: gha-big-data-destroy-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Guard against accidental destruction
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Confirmation input must be DESTROY." >&2
            exit 1
          fi

      - name: Destroy orchestration stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/orchestration init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/orchestration.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/orchestration destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="silver_glue_job_name=placeholder" \
            -var="gold_glue_job_name=placeholder" \
            -var="latest_projection_lambda_arn=arn:aws:lambda:${AWS_REGION}:000000000000:function:placeholder"

      - name: Destroy serving stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/serving init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/serving.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/serving destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="lake_bucket_name=placeholder" \
            -var="athena_results_bucket_name=placeholder" \
            -var="athena_output_location=s3://placeholder/athena-results/" \
            -var="athena_workgroup_name=placeholder"

      - name: Destroy batch stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/batch init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/batch.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/batch destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="market_candles_stream_name=placeholder" \
            -var="market_candles_stream_arn=arn:aws:kinesis:${AWS_REGION}:000000000000:stream/placeholder"

      - name: Destroy core stack
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/core init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/core.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws/core destroy -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="vpc_id=${VPC_ID}" \
            -var="fargate_subnet_ids=${FARGATE_SUBNET_IDS}"
