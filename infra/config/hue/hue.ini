[desktop]
secret_key=local-hue-secret
http_host=0.0.0.0
http_port=8888
time_zone=UTC

[[database]]
engine=sqlite3
name=/tmp/hue.sqlite3

[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs=hdfs://namenode:9000
webhdfs_url=http://namenode:9870/webhdfs/v1
security_enabled=false

[[yarn_clusters]]
[[[default]]]
resourcemanager_host=resourcemanager
resourcemanager_port=8032
resourcemanager_api_url=http://resourcemanager:8088
proxy_api_url=http://resourcemanager:8088
security_enabled=false

[beeswax]
hive_server_host=hiveserver2
hive_server_port=10000
use_sasl=false

[notebook]
[[interpreters]]
[[[hive]]]
name=Hive
interface=hiveserver2

[[[postgresql_platform]]]
name=PostgreSQL platform
interface=sqlalchemy
options='{"url": "postgresql://platform:platform@postgres:5432/platform"}'

[[[postgresql_datamart]]]
name=PostgreSQL datamart
interface=sqlalchemy
options='{"url": "postgresql://trading:trading@postgres:5432/trading_gold"}'
