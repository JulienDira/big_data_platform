spark.master                         yarn
spark.submit.deployMode              cluster
spark.eventLog.enabled               true
spark.eventLog.dir                   hdfs:///spark-history
spark.history.fs.logDirectory        hdfs:///spark-history
spark.sql.catalogImplementation      hive
spark.hadoop.hive.metastore.uris     thrift://hive-metastore:9083
spark.sql.warehouse.dir             hdfs:///warehouse/tablespace/managed/hive
spark.serializer                     org.apache.spark.serializer.KryoSerializer

# Resource allocation - réduit pour permettre 3 jobs en parallèle (Raw + Bronze + Batch)
spark.dynamicAllocation.enabled      false
spark.executor.instances             1
spark.executor.cores                 2
spark.executor.memory                768m
spark.executor.memoryOverhead        192m
spark.driver.cores                   1
spark.driver.memory                  768m
spark.driver.memoryOverhead          384m

# Performance tuning pour traitement par microbatch
spark.sql.shuffle.partitions         8
spark.default.parallelism            8
spark.sql.adaptive.enabled           true

# Stabilité streaming
spark.streaming.blockInterval        200ms
spark.streaming.kafka.maxRatePerPartition 1000
spark.driver.maxResultSize           512m

# Disable memory overhead à cause de YARN
spark.yarn.executor.memoryOverheadFactor 0.25
